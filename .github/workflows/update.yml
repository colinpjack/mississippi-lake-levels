name: Update lake briefing

on:
  schedule:
    # GitHub cron is UTC and often delayed on free plans; hourly keeps the page fresher.
    - cron: "0 * * * *" # every hour, on the hour
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh gauges, weather, chart, and index.html
        env:
          # Free AmbientWeather.net keys — Settings → Secrets and variables → Actions
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APPLICATION_KEY: ${{ secrets.AMBIENT_APPLICATION_KEY }}
          # Optional: pin a station MAC if the account has more than one device
          AMBIENT_MAC: ${{ secrets.AMBIENT_MAC }}
        run: python update_site.py

      - name: Commit updated site (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chart.png data/chart_series.json
          [ -f data/weather.json ] && git add data/weather.json
          [ -f weather_chart.png ] && git add weather_chart.png
          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: refresh Mississippi Lake briefing $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
