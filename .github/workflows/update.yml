name: Update lake briefing

on:
  schedule:
    # GitHub delays or drops jobs queued at minute 0 (highest load on shared runners).
    # Two off-hour slots give a dropped tick another chance in the same hour.
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue the next refresh instead of cancelling — a delayed schedule should still run.
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh gauges, chart, and index.html
        run: python update_site.py

      - name: Commit updated site (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chart.png chart_60.png ytd_chart.png watershed_profile.png watershed_full_profile.png data/chart_series.json
          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: refresh Mississippi Lake briefing $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
