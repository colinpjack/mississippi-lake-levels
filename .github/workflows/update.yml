name: Update lake briefing

on:
  schedule:
    # 8:00, 13:00, 18:00 America/Toronto during EDT (UTC-4) → 12:00, 17:00, 22:00 UTC
    # During EST (UTC-5) these fire one hour "late" locally; adjust seasonally if needed.
    - cron: "0 12,17,22 * * *"
  workflow_dispatch: # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh gauges, chart, and index.html
        run: python update_site.py

      - name: Commit updated site (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html chart.png data/chart_series.json
          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: refresh Mississippi Lake briefing $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
